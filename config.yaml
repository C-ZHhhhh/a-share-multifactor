# ---------- A-share multi-factor project configuration ----------
data:
  start: "2015-01-01"          # raw data start (one year of look-back before first rebalance)
  end: "2026-10-31"
  universe_start: "2016-01-01"
  raw_dir: data/raw
  processed_dir: data/processed
  n_workers: 2                 # parallel baostock sessions

risk_free: 0.015               # annual risk-free rate for the Sharpe ratio (1-year deposit benchmark rate, 2015-2024)
benchmark: sh.000906           # CSI 800 price index: trading calendar & market factor
benchmark_tr: H00906           # CSI 800 total-return index: performance benchmark (portfolio returns include dividends)
indices: [sh.000300, sh.000905, sh.000906]

split:
  is_start: "2016-01-01"       # in-sample: factor research, model/hyper-parameter selection
  is_end: "2021-12-31"
  oos_start: "2022-01-01"      # out-of-sample: touched only once, for final evaluation
  oos_end: "2026-10-31"

filters:
  min_list_days: 250           # exclude sub-new stocks
  exclude_st: true
  exclude_suspended: true
  exclude_limit_up_on_signal: true

model:
  min_train_months: 24         # walk-forward: expanding window, start predicting after 24 months
  label_horizon: 1             # predict next-month return

portfolio:
  risk_aversion: 10.0         # placeholder: step 5 calibrates lambda in-sample (see target_te)
  target_te: 0.04             # lambda rule: the grid value whose mean in-sample EX-ANTE tracking error is closest
                              # to this target (a risk budget; no returns are used to pick lambda)
  lambda_grid: [1, 2, 3, 5, 7, 10, 20, 50]
  max_active_weight: 0.03     # w_i <= b_i + 3% (active, not absolute, cap)
  industry_dev: 0.05           # |w_ind - b_ind| <= 5%
  size_dev: 0.2                # |active size exposure| <= 0.2 std
  turnover_limit: 0.40         # one-way per rebalance
  topn: 50                     # for the simple top-N equal-weight portfolio

costs:
  commission: 0.00025          # each side
  stamp_before_2023_08_28: 0.001   # sell side only
  stamp_after_2023_08_28: 0.0005
  slippage: 0.001              # each side
